<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Calculator</title>
    <link rel="stylesheet" href="stylesheet.css">

</head>

<body>
    <div class="theCalculator">
        <div class="calculator">

            <div class="calculator-display">
                <output>0</output>
            </div>

            <div class="calculator-keys">

                <button class="key key-function">AC</button>
                <button class="key key-function">+/-</button>
                <button class="key key-function">%</button>
                <button class="key key-operator">÷</button>

                <button class="key">7</button>
                <button class="key">8</button>
                <button class="key">9</button>
                <button class="key key-operator">×</button>

                <button class="key">4</button>
                <button class="key">5</button>
                <button class="key">6</button>
                <button class="key key-operator">-</button>

                <button class="key">1</button>
                <button class="key">2</button>
                <button class="key">3</button>
                <button class="key key-operator">+</button>

                <button class="key key-zero">0</button>
                <button class="key">.</button>
                <button class="key key-operator">=</button>

            </div>
        </div>
    </div>


    <script src="calculationFunction.js"></script>
</body>

</html>
